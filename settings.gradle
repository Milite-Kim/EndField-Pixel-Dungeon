//core game code modules
include ':SPD-classes'
include ':core'

//platform modules
//  Skipped when the 'skipAndroid' property is set (e.g. -PskipAndroid), which
//  lets :core be compiled in environments without access to the Android Gradle
//  plugin (google() repository). Normal builds are unaffected.
if (!hasProperty('skipAndroid')) {
    include ':android'
    include ':ios'
    include ':desktop'
}

//service modules
include ':services'
    //updates
    include ':services:updates:debugUpdates'
    include ':services:updates:githubUpdates'
    //news
    include ':services:news:debugNews'
    include ':services:news:shatteredNews'